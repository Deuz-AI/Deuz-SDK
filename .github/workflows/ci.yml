name: CI

on:
  pull_request:
  push:
    branches: [main]
  # release.yml calls this workflow on a version tag and publishes only once every
  # job below has passed on the tag commit (2.4 spec §5.3).
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # `npm run check` is the full gate: format:check + verify:docs-refs + lint
    # + typecheck + test + test:types + build + verify:package + verify:runtime
    # + verify:size + verify:api. It is the same gate release:verify (and
    # therefore release.yml) runs, so this job needs no extra steps: anything
    # added to the root `check` script is picked up here automatically.
    #
    # verify:docs-refs (packages/core/tooling/verify-docs.mjs) is the cheap
    # static lint over docs/ + skills/ + README.md — leaked tool-call debris,
    # hallucinated @deuz-sdk imports, dead /docs/ links, meta.json drift. It
    # runs early on purpose: it is sub-second and it catches the class of
    # breakage that used to reach the `docs` job below minutes later.
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          # Windows is a first-class dev platform here: src/node/workspace.ts
          # (path guards) and src/node/compute.ts (cmd.exe vs bash) have
          # platform-specific behaviour Linux legs cannot catch.
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  react18:
    # F29: @deuz-sdk/react and the frozen @deuz-sdk/core/react declare
    # `react: ^18.0.0 || ^19.0.0`, but the `check` legs only install the React
    # 19 devDependencies, so React 18 was never exercised. This leg puts ONE
    # React 18 under the whole tree. Root `overrides` retarget every react edge
    # (the workspace devDependencies and the peer edges of
    # @testing-library/react, next and styled-jsx). Unlocking the React entries
    # is what makes npm re-resolve them at the root: on an unchanged lockfile
    # npm keeps the hoisted react@19 those peer edges were locked to and nests
    # React 18 under each workspace, so the hooks and the hoisted
    # @testing-library/react would load two different Reacts (`npm i -w` splits
    # the same way). `npm dedupe` would merge them but also floats unrelated
    # packages; this keeps every other package at its locked version.
    name: React 18 (ubuntu-latest, Node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # The repo's pinned npm (`packageManager`), as release.yml does: override
      # and peer placement differ between npm majors, and this recipe was
      # verified on 11.18.0.
      - run: npm install --global npm@11.18.0
      - name: Install React 18 repo-wide
        shell: bash
        run: |
          npm pkg set overrides.react=^18.3.1 overrides.react-dom=^18.3.1 \
            overrides.@types/react=^18.3.0 overrides.@types/react-dom=^18.3.0
          node -e '
            const fs = require("node:fs");
            const lock = JSON.parse(fs.readFileSync("package-lock.json", "utf8"));
            const family = /(^|\/)node_modules\/(react|react-dom|scheduler|@types\/react|@types\/react-dom)$/;
            let dropped = 0;
            for (const key of Object.keys(lock.packages)) {
              if (family.test(key)) {
                delete lock.packages[key];
                dropped++;
              }
            }
            fs.writeFileSync("package-lock.json", JSON.stringify(lock, null, 2) + "\n");
            console.log(`unlocked ${dropped} React lockfile entries`);
          '
          npm install --no-audit --no-fund
      - name: Assert a single hoisted React 18
        shell: bash
        run: |
          npm ls react react-dom
          node -e '
            const path = require("node:path");
            const root = path.resolve("node_modules");
            let ok = true;
            for (const from of ["packages/react", "packages/core", "node_modules/@testing-library/react"]) {
              for (const pkg of ["react", "react-dom", "@types/react"]) {
                const file = require.resolve(`${pkg}/package.json`, { paths: [path.resolve(from)] });
                const { version } = require(file);
                const hoisted = file.startsWith(root + path.sep);
                console.log(`${from} -> ${pkg}@${version}${hoisted ? "" : ` NOT HOISTED: ${file}`}`);
                if (!version.startsWith("18.") || !hoisted) ok = false;
              }
            }
            if (!ok) process.exit(1);
          '
      # The react tests import @deuz-sdk/core from its dist.
      - run: npm run build -w @deuz-sdk/core
      - run: npm run typecheck -w @deuz-sdk/react
      - run: npm run test -w @deuz-sdk/react
      # The frozen @deuz-sdk/core/react hook: its types against @types/react 18,
      # and its tests.
      - run: npm run typecheck -w @deuz-sdk/core
      - run: npm run test -w @deuz-sdk/core -- test/react.test.ts

  integration:
    # Real servers for what the offline suite only fakes: the Redis ops, swarm
    # and runs stores (2.3) against redis:7, and the Postgres stores' concurrent
    # legs (F23) against postgres:16. A test that needs a server reads
    # DEUZ_TEST_REDIS_URL or DEUZ_TEST_POSTGRES_URL and skips without it, so the
    # `check` legs stay offline. Here DEUZ_TEST_REQUIRE_SERVICES=1 turns that
    # skip into a failure: a server that did not come up, or a URL that went
    # missing, cannot pass as green.
    name: Integration (Redis 7, Postgres 16)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: deuz
          POSTGRES_DB: deuz
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      DEUZ_TEST_REDIS_URL: redis://localhost:6379
      DEUZ_TEST_POSTGRES_URL: postgres://postgres:deuz@localhost:5432/deuz
      DEUZ_TEST_REQUIRE_SERVICES: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -w @deuz-sdk/core
      - run: npm run test -w @deuz-sdk/core

  docker:
    # The Linux leg with every real backend (2.4 spec §5.3): SQLite, Postgres 16,
    # Redis 7 and Docker, which GitHub's ubuntu runners ship. DEUZ_TEST_DOCKER=1
    # opts the Docker runner tests in, and DEUZ_TEST_REQUIRE_SERVICES=1 makes a
    # missing daemon or server fail instead of skipping. That is why this job
    # carries the same two service containers as `integration`: until the 2.4
    # Docker tests land it runs the whole core suite, and once they do it can
    # narrow to them.
    name: Docker (ubuntu-latest, Node 22)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s
          --health-retries 10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: deuz
          POSTGRES_DB: deuz
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s
          --health-retries 10
    env:
      DEUZ_TEST_REDIS_URL: redis://localhost:6379
      DEUZ_TEST_POSTGRES_URL: postgres://postgres:deuz@localhost:5432/deuz
      DEUZ_TEST_DOCKER: '1'
      DEUZ_TEST_REQUIRE_SERVICES: '1'
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      # Fails here, once, if the runner has no usable Docker daemon.
      - run: docker version
      - run: npm ci
      - run: npm run build -w @deuz-sdk/core
      - run: npm run test -w @deuz-sdk/core

  # rollback:
  #   # TODO(W2 R1): uncomment once packages/core/package.json has a `test:rollback`
  #   # script. The rollback rule (2.4 spec §4.2, §5.3): @deuz-sdk/core@2.3.0, which
  #   # that script installs from npm into a scratch directory, still opens and
  #   # uses the SQLite and Postgres databases 2.4 wrote. test/release-pipeline.test.ts
  #   # fails while the script exists and this job is still commented out.
  #   name: Rollback (2.3.0 opens what 2.4 wrote)
  #   runs-on: ubuntu-latest
  #   services:
  #     postgres:
  #       image: postgres:16
  #       env:
  #         POSTGRES_PASSWORD: deuz
  #         POSTGRES_DB: deuz
  #       ports: ['5432:5432']
  #       options: >-
  #         --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 3s
  #         --health-retries 10
  #   env:
  #     DEUZ_TEST_POSTGRES_URL: postgres://postgres:deuz@localhost:5432/deuz
  #     DEUZ_TEST_REQUIRE_SERVICES: '1'
  #   steps:
  #     - uses: actions/checkout@v5
  #     - uses: actions/setup-node@v5
  #       with:
  #         node-version: 22
  #         cache: npm
  #     - run: npm ci
  #     - run: npm run build -w @deuz-sdk/core
  #     - run: npm run test:rollback -w @deuz-sdk/core

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run types:check
      - run: npm run build
