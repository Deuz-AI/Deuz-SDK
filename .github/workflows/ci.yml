name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # `npm run check` is the full gate: format:check + verify:docs-refs + lint
    # + typecheck + test + test:types + build + verify:package + verify:runtime
    # + verify:size + verify:api. It is the same gate release:verify (and
    # therefore release.yml) runs, so this job needs no extra steps: anything
    # added to the root `check` script is picked up here automatically.
    #
    # verify:docs-refs (packages/core/tooling/verify-docs.mjs) is the cheap
    # static lint over docs/ + skills/ + README.md — leaked tool-call debris,
    # hallucinated @deuz-sdk imports, dead /docs/ links, meta.json drift. It
    # runs early on purpose: it is sub-second and it catches the class of
    # breakage that used to reach the `docs` job below minutes later.
    name: Check (${{ matrix.os }}, Node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            node: 22
          - os: ubuntu-latest
            node: 24
          # Windows is a first-class dev platform here: src/node/workspace.ts
          # (path guards) and src/node/compute.ts (cmd.exe vs bash) have
          # platform-specific behaviour Linux legs cannot catch.
          - os: windows-latest
            node: 22
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run check

  docs:
    name: Documentation build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: docs
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: docs/package-lock.json
      - run: npm ci
      - run: npm run types:check
      - run: npm run build
