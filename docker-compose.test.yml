# Local copies of the CI `integration` job's services (.github/workflows/ci.yml).
# Start them with `npm run services:up`, then export:
#   DEUZ_TEST_POSTGRES_URL=postgres://postgres:deuz@localhost:5432/deuz
#   DEUZ_TEST_REDIS_URL=redis://localhost:6379
# Tests that need a server read these variables and skip without them, unless
# DEUZ_TEST_REQUIRE_SERVICES=1 turns a missing server into a failure.
name: deuz-test
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: deuz
      POSTGRES_DB: deuz
    ports: ['5432:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7
    ports: ['6379:6379']
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10
